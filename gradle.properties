# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Memoria para el daemon de compilación (aumentado a 4GB con GC paralelo para máxima velocidad)
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Compilación en paralelo para aprovechar todos los núcleos de tu procesador
org.gradle.parallel=true

# Caché de compilación para no recompilar lo que no cambió
org.gradle.caching=true

# Caché de configuración de Gradle
org.gradle.configuration-cache=true

# Mantener el demonio activo en memoria para que no arranque desde cero
org.gradle.daemon=true

# Memoria dedicada al compilador de Kotlin
kotlin.daemon.jvmargs=-Xmx2048m

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
